<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:metadata>
  <f:viewParam name="id" value="#{universityController.formStudentId}"/>
  <f:event type="preRenderView" listener="#{universityController.initForm}"/>
</f:metadata>
<h:head>
  <title>Edit Student</title>
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css"/>
</h:head>
<h:body>
  <h1>Edit Student</h1>

  <h:panelGroup rendered="#{not empty universityController.errorMessage}">
    <p style="color:red;">#{universityController.errorMessage}</p>
    <h:form rendered="#{universityController.hasConflict}">
      <h:commandButton value="Overwrite anyway"
                       action="#{universityController.overwriteStudent}"/>
      &#160;
      <h:commandButton value="Refresh and retry"
                       action="#{universityController.refreshAndRetry}"
                       immediate="true"/>
    </h:form>
  </h:panelGroup>

  <h:form>
    <h:inputHidden value="#{universityController.formStudent.id}"/>
    <h:inputHidden value="#{universityController.formStudent.optLockVersion}"/>

    <table>
      <tr>
        <td>First Name:</td>
        <td><h:inputText value="#{universityController.formStudent.firstName}" required="true"/></td>
      </tr>
      <tr>
        <td>Last Name:</td>
        <td><h:inputText value="#{universityController.formStudent.lastName}" required="true"/></td>
      </tr>
      <tr>
        <td>Email:</td>
        <td><h:inputText value="#{universityController.formStudent.email}"/></td>
      </tr>
      <tr>
        <td>University:</td>
        <td>
          <h:selectOneMenu value="#{universityController.selectedUniversityId}">
            <f:selectItem itemLabel="-- None --" itemValue=""/>
            <f:selectItems value="#{universityController.universities}" var="u"
                           itemLabel="#{u.name}" itemValue="#{u.id}"/>
            <f:ajax event="change" render="courseSelect" execute="@this"/>
          </h:selectOneMenu>
        </td>
      </tr>
      <tr>
        <td>Courses:</td>
        <td>
          <h:selectManyListbox id="courseSelect" value="#{universityController.selectedCourseIds}" size="5">
            <f:converter converterId="javax.faces.Long"/>
            <f:selectItems value="#{universityController.filteredCourses}" var="c"
                           itemLabel="#{c.title}" itemValue="#{c.id}"/>
          </h:selectManyListbox>
          <br/><small>Hold Ctrl / Cmd to select multiple.</small>
        </td>
      </tr>
    </table>
    <br/>
    <h:commandButton value="Save Changes" action="#{universityController.saveStudent}"/>
  </h:form>

  <br/>
  <h:link value="Back to list" outcome="university"/>
</h:body>
</html>
